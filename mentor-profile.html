<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Mentor Profile - MentifyHub</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="mh-theme.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { background: #f4f6fa; }

    /* ── Breadcrumb ── */
    .breadcrumb {
      padding: 14px 48px;
      font-size: 13px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .breadcrumb a { color: #2563eb; text-decoration: none; font-weight: 600; }
    .breadcrumb a:hover { text-decoration: underline; }
    .breadcrumb span { color: var(--muted); }

    /* ── Banner ── */
    .profile-banner {
      height: 180px;
      background: linear-gradient(135deg, #1e3a5f 0%, #1d4ed8 50%, #7c3aed 100%);
      position: relative;
      overflow: hidden;
      margin: 0 48px;
      border-radius: 20px;
    }
    .banner-blob {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
    }
    .bb1 { width: 200px; height: 200px; top: -60px; left: 30%; }
    .bb2 { width: 140px; height: 140px; top: 20px; right: 80px; }
    .bb3 { width: 100px; height: 100px; bottom: -30px; right: 200px; }

    /* ── Profile header ── */
    .profile-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 48px 0;
      position: relative;
      z-index: 2;
      background: #fff;
      border-bottom: 1px solid #f1f5f9;
      margin: 0 48px;
      border-radius: 0 0 20px 20px;
    }
    .profile-header-left {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: -50px;
      padding-bottom: 20px;
    }
    .profile-photo-wrap {
      flex-shrink: 0;
    }
    .profile-photo {
      width: 100px; height: 100px;
      border-radius: 50%;
      border: 4px solid #fff;
      object-fit: cover;
      display: block;
      box-shadow: 0 4px 20px rgba(15,23,42,.15);
      background: linear-gradient(135deg, #dbeafe, #ede9fe);
    }
    .profile-info {
      flex: 1;
      padding-top: 50px;
    }
    .profile-name {
      font-size: 24px;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: -.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .profile-country-badge {
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      background: #f1f5f9;
      border-radius: 6px;
      padding: 2px 8px;
    }
    .profile-headline {
      font-size: 14px;
      color: #475569;
      margin-top: 4px;
    }
    .profile-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 20px;
      align-self: flex-end;
    }
    .action-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1.5px solid #e2e8f0;
      background: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 16px;
      transition: border-color .15s, background .15s;
    }
    .action-btn:hover { border-color: #2563eb; background: #eff6ff; }

    /* ── Main layout ── */
    .profile-body {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
      padding: 24px 48px 48px;
    }

    /* ── Tabs ── */
    .profile-tabs {
      display: flex;
      gap: 0;
      border-bottom: 2px solid #e2e8f0;
      margin-bottom: 24px;
    }
    .tab {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color .15s, border-color .15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tab.active { color: #2563eb; border-bottom-color: #2563eb; }
    .tab:hover { color: #0f172a; }
    .tab-badge {
      background: #0f172a;
      color: #fff;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      padding: 1px 7px;
      min-width: 20px;
      text-align: center;
    }

    /* ── Tab panels ── */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Bio section ── */
    .bio-text {
      font-size: 15px;
      color: #334155;
      line-height: 1.75;
      margin-bottom: 16px;
    }
    .bio-text.clamped {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .show-more-btn {
      color: #2563eb;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }
    .show-more-btn:hover { text-decoration: underline; }

    /* Social links */
    .social-links { display: flex; gap: 10px; margin-top: 16px; margin-bottom: 24px; }
    .social-link {
      width: 36px; height: 36px;
      border-radius: 8px;
      border: 1.5px solid #e2e8f0;
      background: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; text-decoration: none;
      transition: border-color .15s;
    }
    .social-link:hover { border-color: #2563eb; }

    /* Background section */
    .section-title {
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
      margin: 24px 0 14px;
    }
    .bg-row {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid #f1f5f9;
    }
    .bg-row:last-child { border-bottom: none; }
    .bg-label { font-size: 13px; color: #94a3b8; width: 120px; flex-shrink: 0; font-weight: 600; }
    .bg-value { font-size: 14px; color: #334155; flex: 1; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag-pill {
      padding: 4px 12px;
      border-radius: 999px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #2563eb;
      font-size: 12px;
      font-weight: 600;
    }
    .tag-pill.green { background: #f0fdf4; border-color: #bbf7d0; color: #16a34a; }

    /* ── Reviews ── */
    .review-card {
      background: #fff;
      border: 1px solid #e8edf5;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 14px;
    }
    .review-stars { color: #f59e0b; font-size: 14px; letter-spacing: 2px; margin-bottom: 10px; }
    .review-text { font-size: 14px; color: #334155; line-height: 1.65; margin-bottom: 14px; }
    .review-author { display: flex; align-items: center; gap: 10px; }
    .review-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg,#2563eb,#7c3aed);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .review-meta .rm-name { font-size: 13px; font-weight: 700; color: #0f172a; }
    .review-meta .rm-date { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    .no-reviews { text-align: center; padding: 40px; color: #94a3b8; font-size: 14px; }

    /* ── Right sidebar ── */
    .sidebar-card {
      background: #fff;
      border: 1px solid #e8edf5;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(15,23,42,.05);
    }
    .sidebar-card h3 {
      font-size: 15px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar-card h3 a { font-size: 13px; color: #2563eb; font-weight: 600; text-decoration: none; }
    .sidebar-card h3 a:hover { text-decoration: underline; }

    /* Community stats */
    .stat-row {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
    }
    .stat-box {
      flex: 1;
      background: #f8faff;
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .stat-icon { font-size: 22px; }
    .stat-num  { font-size: 20px; font-weight: 900; color: #0f172a; line-height: 1; }
    .stat-lbl  { font-size: 11px; color: #94a3b8; margin-top: 3px; }

    /* Request button */
    .request-btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      background: #2563eb;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: background .15s, transform .1s;
      margin-bottom: 10px;
    }
    .request-btn:hover { background: #1d4ed8; transform: translateY(-1px); }

    /* Info rows */
    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 13px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-row .ir-label { color: #94a3b8; font-weight: 600; }
    .info-row .ir-value { color: #0f172a; font-weight: 700; }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .profile-banner, .profile-header, .profile-body { margin-left: 20px; margin-right: 20px; padding-left: 0; padding-right: 0; }
      .profile-body { grid-template-columns: 1fr; }
      .profile-header { flex-wrap: wrap; }
      .breadcrumb { padding: 14px 20px; }
    }
  </style>
</head>
<body>

<!-- Breadcrumb -->
<div class="breadcrumb">
  <a href="index.html">Home</a>
  <span>/</span>
  <a href="mentor-directory.html">Explore</a>
  <span>/</span>
  <span id="breadcrumbName">Mentor</span>
</div>

<!-- Banner -->
<div class="profile-banner">
  <div class="banner-blob bb1"></div>
  <div class="banner-blob bb2"></div>
  <div class="banner-blob bb3"></div>
</div>

<!-- Profile header -->
<div class="profile-header">
  <div class="profile-header-left">
    <div class="profile-photo-wrap">
      <img class="profile-photo" id="photo" src="logo.png" alt="Mentor photo"/>
    </div>
    <div class="profile-info">
      <div class="profile-name">
        <span id="name">Loading...</span>
        <span class="profile-country-badge" id="countryBadge"></span>
      </div>
      <div class="profile-headline" id="headline"></div>
    </div>
  </div>
  <div class="profile-actions">
    <div class="action-btn" title="Message" id="msgBtn">💬</div>
    <div class="action-btn" title="Save">🤍</div>
  </div>
</div>

<!-- Body -->
<div class="profile-body">

  <!-- Left: tabs -->
  <div>
    <div class="profile-tabs">
      <div class="tab active" onclick="switchTab('overview', this)">Overview</div>
      <div class="tab" onclick="switchTab('reviews', this)">Reviews <span class="tab-badge" id="reviewCount">0</span></div>
    </div>

    <!-- Overview tab -->
    <div class="tab-panel active" id="tab-overview">

      <div class="bio-text clamped" id="bio">Loading...</div>
      <button class="show-more-btn" id="showMoreBtn" onclick="toggleBio()">Show more</button>

      <div class="social-links" id="socialLinks"></div>

      <div class="section-title">Background</div>

      <div class="bg-row">
        <span class="bg-label">Field</span>
        <span class="bg-value" id="field">-</span>
      </div>
      <div class="bg-row">
        <span class="bg-label">Experience</span>
        <span class="bg-value" id="experience">-</span>
      </div>
      <div class="bg-row">
        <span class="bg-label">Pricing</span>
        <span class="bg-value" id="pricing">-</span>
      </div>
      <div class="bg-row">
        <span class="bg-label">Communication</span>
        <span class="bg-value" id="communication">-</span>
      </div>
      <div class="bg-row">
        <span class="bg-label">Availability</span>
        <span class="bg-value" id="availability">-</span>
      </div>
      <div class="bg-row">
        <span class="bg-label">Timezone</span>
        <span class="bg-value" id="timezone">-</span>
      </div>

      <div class="section-title">Expertise tags</div>
      <div class="tag-list" id="tags"></div>

    </div>

    <!-- Reviews tab -->
    <div class="tab-panel" id="tab-reviews">
      <div id="reviewsList"><div class="no-reviews">Loading reviews...</div></div>
    </div>

  </div>

  <!-- Right: sidebar -->
  <div>

    <!-- Request button -->
    <div class="sidebar-card">
      <button class="request-btn" id="requestBtn">Request mentorship</button>
      <div class="info-row">
        <span class="ir-label">Availability</span>
        <span class="ir-value" id="availSide">-</span>
      </div>
      <div class="info-row">
        <span class="ir-label">Communication</span>
        <span class="ir-value" id="commSide">-</span>
      </div>
      <div class="info-row">
        <span class="ir-label">Pricing</span>
        <span class="ir-value" id="priceSide">-</span>
      </div>
      <div class="info-row">
        <span class="ir-label">Timezone</span>
        <span class="ir-value" id="tzSide">-</span>
      </div>
    </div>

    <!-- Community stats -->
    <div class="sidebar-card">
      <h3>Community statistics</h3>
      <div class="stat-row">
        <div class="stat-box">
          <span class="stat-icon">🚀</span>
          <div>
            <div class="stat-num" id="statSessions">0</div>
            <div class="stat-lbl">Sessions</div>
          </div>
        </div>
        <div class="stat-box">
          <span class="stat-icon">⭐</span>
          <div>
            <div class="stat-num" id="statReviews">0</div>
            <div class="stat-lbl">Reviews</div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  const SUPABASE_URL      = "https://mscgaaaobxiuzqsukvjc.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zY2dhYWFvYnhpdXpxc3VrdmpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg1MDU5NjIsImV4cCI6MjA4NDA4MTk2Mn0.5MWa3RUQmkpchRqn7q1CJz37amlnqIBE-s6HMQ455-Y";
  const sb  = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const id  = new URLSearchParams(window.location.search).get("id");
  const $   = id2 => document.getElementById(id2);

  // ── Tabs ──
  function switchTab(name, el){
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    el.classList.add("active");
    document.getElementById("tab-" + name).classList.add("active");
  }

  // ── Bio toggle ──
  let bioExpanded = false;
  function toggleBio(){
    bioExpanded = !bioExpanded;
    $("bio").classList.toggle("clamped", !bioExpanded);
    $("showMoreBtn").textContent = bioExpanded ? "Show less" : "Show more";
  }

  // ── Load profile ──
  async function loadProfile(){
    if(!id){ $("name").textContent = "Mentor not found"; return; }

    const {data, error} = await sb.from("mentors").select("*").eq("user_id", id).single();
    if(error || !data){ console.error(error); $("name").textContent = "Profile not found"; return; }

    // Header
    $("photo").src         = data.profile_image || "logo.png";
    $("photo").onerror     = () => { $("photo").src = "logo.png"; };
    $("name").textContent  = data.full_name || "Mentor";
    $("breadcrumbName").textContent = data.full_name || "Mentor";
    $("headline").textContent = data.headline || "";
    $("countryBadge").textContent = data.country || "";

    // Bio
    $("bio").textContent = data.bio || "No bio yet.";
    if(!data.bio || data.bio.length < 200){
      $("showMoreBtn").style.display = "none";
    }

    // Social links
    const socials = $("socialLinks");
    if(data.profile_link){
      const link = data.profile_link.includes("linkedin") 
        ? `<a class="social-link" href="${data.profile_link.startsWith("http") ? data.profile_link : "https://"+data.profile_link}" target="_blank" title="LinkedIn">💼</a>`
        : `<a class="social-link" href="${data.profile_link.startsWith("http") ? data.profile_link : "https://"+data.profile_link}" target="_blank" title="Website">🌐</a>`;
      socials.innerHTML += link;
    }
    if(!data.profile_link){ socials.style.display = "none"; }

    // Background
    $("field").textContent        = data.field        || "-";
    $("experience").textContent   = data.experience   || "-";
    $("pricing").textContent      = data.pricing_type || "-";
    $("communication").textContent= data.communication|| "-";
    $("availability").textContent = data.availability || "-";
    $("timezone").textContent     = data.timezone     || "-";

    // Tags
    const tagsBox = $("tags");
    (data.tags || []).forEach(tag => {
      const span = document.createElement("span");
      span.className = "tag-pill";
      span.textContent = tag;
      tagsBox.appendChild(span);
    });

    // Sidebar
    $("availSide").textContent = data.availability  || "-";
    $("commSide").textContent  = data.communication || "-";
    $("priceSide").textContent = data.pricing_type  || "-";
    $("tzSide").textContent    = data.timezone      || "-";

    // Stats
    const {count: sc} = await sb.from("sessions").select("*",{count:"exact",head:true}).eq("mentor_id", id);
    const {count: rc} = await sb.from("reviews").select("*",{count:"exact",head:true}).eq("mentor_id", id);
    $("statSessions").textContent = sc || 0;
    $("statReviews").textContent  = rc || 0;
    $("reviewCount").textContent  = rc || 0;

    // Reviews
    loadReviews(id);
  }

  async function loadReviews(mentorId){
    const {data} = await sb.from("reviews")
      .select("rating, comment, created_at, reviewer_id")
      .eq("mentor_id", mentorId)
      .order("created_at", {ascending: false})
      .limit(10);

    const list = $("reviewsList");
    if(!data || !data.length){
      list.innerHTML = '<div class="no-reviews">No reviews yet.</div>';
      return;
    }
    list.innerHTML = "";
    data.forEach((r, i) => {
      const stars = "★".repeat(Math.min(r.rating||5,5));
      const date  = r.created_at ? new Date(r.created_at).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}) : "";
      const init  = String.fromCharCode(65 + (i % 26));
      const card  = document.createElement("div");
      card.className = "review-card";
      card.innerHTML = `
        <div class="review-stars">${stars}</div>
        <div class="review-text">${r.comment || ""}</div>
        <div class="review-author">
          <div class="review-avatar">${init}</div>
          <div class="review-meta">
            <div class="rm-name">MentifyHub Member</div>
            <div class="rm-date">${date}</div>
          </div>
        </div>`;
      list.appendChild(card);
    });
  }

  loadProfile();

  $("requestBtn").onclick = () => {
    window.location.href = `mentor-directory.html?request=${id}`;
  };

  // Message button - goes to messages if logged in, else signup
  $("msgBtn").onclick = async () => {
    try {
      const {data:{session}} = await sb.auth.getSession();
      if(session){
        window.location.href = `messages.html?mentor=${id}`;
      } else {
        window.location.href = `auth.html?mode=signup&returnTo=mentor-profile.html?id=${id}`;
      }
    } catch(e) {
      window.location.href = `auth.html?mode=signup&returnTo=mentor-profile.html?id=${id}`;
    }
  };
</script>
</body>
</html>
