<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>MentifyHub - Sessions</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth-guard.js"></script>
  <link rel="stylesheet" href="mh-theme.css"/>
  <style>
    body { background: #f4f6fa; }

    .page-wrap { max-width: 900px; margin: 0 auto; padding: 24px 20px 60px; }

    /* Header */
    .page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
    .page-header h1 { font-size:22px; font-weight:900; letter-spacing:-.3px; }
    .page-header p  { font-size:13px; color:var(--muted); margin-top:3px; }

    /* Tabs */
    .tab-bar { display:flex; gap:0; border-bottom:2px solid var(--line); margin-bottom:24px; }
    .tab-btn { padding:10px 20px; font-size:14px; font-weight:700; color:var(--muted); border:none; background:none; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; transition:all .15s; }
    .tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); }
    .tab-btn:hover  { color:var(--text); }
    .tab-badge { background:var(--accent); color:#fff; border-radius:999px; font-size:11px; font-weight:700; padding:1px 7px; margin-left:6px; }

    /* Session cards */
    .sessions-list { display:flex; flex-direction:column; gap:14px; }
    .session-card {
      background:#fff; border:1px solid var(--line); border-radius:18px;
      padding:20px; box-shadow:0 1px 4px rgba(15,23,42,.05);
      transition:transform .2s, box-shadow .2s;
    }
    .session-card:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(15,23,42,.09); }

    .sc-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:12px; }
    .sc-date { font-size:16px; font-weight:900; color:var(--text); }
    .sc-time { font-size:13px; color:var(--muted); margin-top:2px; }

    .sc-badge {
      padding:4px 12px; border-radius:999px; font-size:12px; font-weight:700;
    }
    .badge-scheduled  { background:#eff6ff; color:#2563eb; border:1px solid #bfdbfe; }
    .badge-completed  { background:#f0fdf4; color:#16a34a; border:1px solid #bbf7d0; }
    .badge-cancelled  { background:#fef2f2; color:#ef4444; border:1px solid #fca5a5; }
    .badge-proposed   { background:#fefce8; color:#ca8a04; border:1px solid #fde68a; }

    .sc-person { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
    .sc-avatar {
      width:38px; height:38px; border-radius:50%;
      background:linear-gradient(135deg,#2563eb,#7c3aed);
      display:flex; align-items:center; justify-content:center;
      font-size:14px; font-weight:700; color:#fff; flex-shrink:0;
    }
    .sc-person-name { font-size:14px; font-weight:700; color:var(--text); }
    .sc-person-role { font-size:12px; color:var(--muted); }

    .sc-info { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:14px; }
    .sc-info-item { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:5px; }
    .sc-info-item strong { color:var(--text); font-weight:700; }

    /* Meeting link input */
    .meeting-link-row { display:flex; gap:8px; margin-bottom:12px; }
    .meeting-link-row input {
      flex:1; padding:9px 14px; border-radius:10px; border:1.5px solid var(--line);
      font:inherit; font-size:13px; outline:none; transition:border-color .2s;
    }
    .meeting-link-row input:focus { border-color:var(--accent); }
    .meeting-link-row button {
      padding:9px 16px; border-radius:10px; border:none; background:var(--accent);
      color:#fff; font:inherit; font-size:13px; font-weight:700; cursor:pointer;
    }

    /* Progress notes */
    .progress-section { margin-top:12px; border-top:1px solid var(--line); padding-top:12px; }
    .progress-section label { font-size:12px; font-weight:700; color:var(--muted); display:block; margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px; }
    .progress-section textarea {
      width:100%; padding:10px 14px; border-radius:10px; border:1.5px solid var(--line);
      font:inherit; font-size:13px; resize:vertical; min-height:70px; outline:none;
      transition:border-color .2s;
    }
    .progress-section textarea:focus { border-color:var(--accent); }

    /* Actions */
    .sc-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .btn-join { background:#2563eb; color:#fff; padding:9px 18px; border-radius:10px; font:inherit; font-size:13px; font-weight:700; border:none; cursor:pointer; text-decoration:none; transition:background .15s; }
    .btn-join:hover { background:#1d4ed8; }
    .btn-complete { background:#16a34a; color:#fff; padding:9px 18px; border-radius:10px; font:inherit; font-size:13px; font-weight:700; border:none; cursor:pointer; transition:background .15s; }
    .btn-complete:hover { background:#15803d; }
    .btn-cancel { background:#fff; color:#ef4444; padding:9px 18px; border-radius:10px; font:inherit; font-size:13px; font-weight:700; border:1.5px solid #fca5a5; cursor:pointer; transition:all .15s; }
    .btn-cancel:hover { background:#fef2f2; }
    .btn-review { background:#f59e0b; color:#fff; padding:9px 18px; border-radius:10px; font:inherit; font-size:13px; font-weight:700; border:none; cursor:pointer; transition:background .15s; text-decoration:none; }
    .btn-review:hover { background:#d97706; }
    .btn-save-link { background:#eff6ff; color:#2563eb; padding:9px 18px; border-radius:10px; font:inherit; font-size:13px; font-weight:700; border:1.5px solid #bfdbfe; cursor:pointer; }

    /* Empty state */
    .empty-state { text-align:center; padding:60px 20px; color:var(--muted); }
    .empty-state .es-icon { font-size:48px; margin-bottom:12px; }
    .empty-state h3 { font-size:16px; font-weight:800; color:var(--text); margin-bottom:8px; }
    .empty-state p  { font-size:14px; }

    /* Loading */
    .loading { text-align:center; padding:40px; color:var(--muted); font-size:14px; }
  </style>
</head>
<body>
<div class="mh-wrap">
  <header class="mh-topbar">
    <a href="index.html" class="mh-brand">
      <img src="logo.png" alt="MentifyHub" class="mh-brand-logo"/>
      <div class="mh-brand-text"><strong>MentifyHub</strong><span>Sessions</span></div>
    </a>
    <nav class="mh-nav hide-mobile">
      <span class="mh-chip" id="whoChip">Checking...</span>
      <a class="mh-btn" href="#" id="dashboardLink">← Dashboard</a>
      <a class="mh-btn" href="mentor-directory.html">Browse mentors</a>
      <a class="mh-btn" href="messages.html">Messages</a>
      <a class="mh-btn mh-btn-primary" href="sessions.html">Sessions</a>
      <a class="mh-btn" href="reviews.html">⭐ Reviews</a>
      <button class="mh-btn mh-btn-danger" id="signOutBtn">Sign out</button>
    </nav>
    <button class="mh-menu-btn" onclick="openDrawer()"><span></span><span></span><span></span></button>
  </header>

  <div class="page-wrap">
    <div class="page-header">
      <div>
        <h1>Sessions</h1>
        <p id="pageSubtitle">Your mentorship sessions</p>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('upcoming', this)">
        Upcoming <span class="tab-badge" id="upcomingCount">0</span>
      </button>
      <button class="tab-btn" onclick="switchTab('completed', this)">
        Completed <span class="tab-badge" id="completedCount">0</span>
      </button>
      <button class="tab-btn" onclick="switchTab('cancelled', this)">
        Cancelled <span class="tab-badge" id="cancelledCount">0</span>
      </button>
    </div>

    <!-- Session lists -->
    <div id="tab-upcoming"><div class="loading">Loading sessions...</div></div>
    <div id="tab-completed" style="display:none"><div class="loading">Loading...</div></div>
    <div id="tab-cancelled" style="display:none"><div class="loading">Loading...</div></div>
  </div>
</div>

<script>
  const SUPABASE_URL      = "https://mscgaaaobxiuzqsukvjc.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zY2dhYWFvYnhpdXpxc3VrdmpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg1MDU5NjIsImV4cCI6MjA4NDA4MTk2Mn0.5MWa3RUQmkpchRqn7q1CJz37amlnqIBE-s6HMQ455-Y";
  const sb  = window.mhSb || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $   = id => document.getElementById(id);

  let USER = null, IS_MENTOR = false;
  let allSessions = [];

  // ── Tabs ──────────────────────────────────────────────────────
  function switchTab(name, el){
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    el.classList.add("active");
    ["upcoming","completed","cancelled"].forEach(t => {
      $(` tab-${t}`) ;
      $("tab-" + t).style.display = t === name ? "block" : "none";
    });
  }

  // ── Auth ──────────────────────────────────────────────────────
  async function init(){
    try {
      const {data:{session}} = await sb.auth.getSession();
      if(!session){ window.location.href = "auth.html?mode=signin&returnTo=sessions.html"; return; }
      USER = session.user;

      const {data:mp} = await sb.from("mentors").select("user_id,full_name").eq("user_id", USER.id).maybeSingle();
      IS_MENTOR = !!mp;

      const dash = IS_MENTOR ? "mentor-dashboard.html" : "mentee-dashboard.html";
      $("dashboardLink").href = dash;
      $("whoChip").textContent = (mp?.full_name || USER.email) + (IS_MENTOR ? " · Mentor" : " · Mentee");
      $("pageSubtitle").textContent = IS_MENTOR
        ? "Sessions booked by your mentees"
        : "Your upcoming and past sessions";

      await loadSessions();

      // Realtime - refresh when sessions change
      sb.channel("sessions-page-" + USER.id)
        .on("postgres_changes", { event: "*", schema: "public", table: "sessions" }, () => loadSessions())
        .subscribe();

    } catch(e){ console.error(e); }
  }

  // ── Load sessions ─────────────────────────────────────────────
  async function loadSessions(){
    const field = IS_MENTOR ? "mentor_id" : "mentee_id";
    const {data, error} = await sb.from("sessions")
      .select("*")
      .eq(field, USER.id)
      .order("scheduled_for", {ascending: true});

    if(error){ console.error(error); return; }
    allSessions = data || [];

    const upcoming  = allSessions.filter(s => s.status !== "completed" && s.status !== "cancelled");
    const completed = allSessions.filter(s => s.status === "completed");
    const cancelled = allSessions.filter(s => s.status === "cancelled");

    $("upcomingCount").textContent  = upcoming.length;
    $("completedCount").textContent = completed.length;
    $("cancelledCount").textContent = cancelled.length;

    // Get other party names
    const ids = [...new Set(allSessions.map(s => IS_MENTOR ? s.mentee_id : s.mentor_id).filter(Boolean))];
    const table = IS_MENTOR ? "mentees" : "mentors";
    const {data: people} = await sb.from(table).select("user_id, full_name").in("user_id", ids);
    const nameMap = {};
    (people || []).forEach(p => nameMap[p.user_id] = p.full_name);

    renderList("tab-upcoming",  upcoming,  nameMap, "No upcoming sessions.");
    renderList("tab-completed", completed, nameMap, "No completed sessions yet.");
    renderList("tab-cancelled", cancelled, nameMap, "No cancelled sessions.");
  }

  // ── Render list ───────────────────────────────────────────────
  function renderList(containerId, sessions, nameMap, emptyMsg){
    const el = $(containerId);
    if(!sessions.length){
      el.innerHTML = `<div class="empty-state">
        <div class="es-icon">📅</div>
        <h3>${emptyMsg}</h3>
        <p>${containerId === "tab-upcoming" && !IS_MENTOR ? "Book a session from your dashboard after a mentor accepts your request." : ""}</p>
      </div>`;
      return;
    }

    el.innerHTML = "";
    const list = document.createElement("div");
    list.className = "sessions-list";

    sessions.forEach(s => {
      const otherId   = IS_MENTOR ? s.mentee_id : s.mentor_id;
      const otherName = nameMap[otherId] || (IS_MENTOR ? "Mentee" : "Mentor");
      const initial   = otherName[0].toUpperCase();
      const dt        = new Date(s.scheduled_for);
      const dateStr   = dt.toLocaleDateString("en-GB", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
      const timeStr   = dt.toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"});
      const isPast    = dt < new Date();

      const card = document.createElement("div");
      card.className = "session-card";
      card.id = "session-" + s.id;

      const badgeClass = {
        scheduled: "badge-scheduled",
        completed: "badge-completed",
        cancelled: "badge-cancelled",
        proposed:  "badge-proposed",
      }[s.status] || "badge-scheduled";

      card.innerHTML = `
        <div class="sc-header">
          <div>
            <div class="sc-date">${dateStr}</div>
            <div class="sc-time">${timeStr}</div>
          </div>
          <span class="sc-badge ${badgeClass}">${s.status || "scheduled"}</span>
        </div>

        <div class="sc-person">
          <div class="sc-avatar">${initial}</div>
          <div>
            <div class="sc-person-name">${otherName}</div>
            <div class="sc-person-role">${IS_MENTOR ? "Mentee" : "Your mentor"}</div>
          </div>
        </div>

        <div class="sc-info">
          <div class="sc-info-item">⏱ <strong>${s.duration_minutes || 60} mins</strong></div>
          ${s.meeting_link ? `<div class="sc-info-item">🔗 <strong>Meeting link set</strong></div>` : ""}
          ${s.notes ? `<div class="sc-info-item">📝 <strong>Has notes</strong></div>` : ""}
        </div>

        ${IS_MENTOR && s.status !== "cancelled" && s.status !== "completed" ? `
          <div class="meeting-link-row">
            <input type="url" id="link-${s.id}" placeholder="Add meeting link (Zoom, Google Meet...)" value="${s.meeting_link || ""}"/>
            <button class="btn-save-link" onclick="saveMeetingLink('${s.id}')">Save</button>
          </div>` : ""}

        <div class="sc-actions">
          ${s.meeting_link ? `<a class="btn-join" href="${s.meeting_link}" target="_blank">🎥 Join meeting</a>` : ""}
          ${IS_MENTOR && s.status === "scheduled" && isPast ? `<button class="btn-complete" onclick="markCompleted('${s.id}')">✅ Mark completed</button>` : ""}
          ${IS_MENTOR && s.status !== "cancelled" && s.status !== "completed" ? `<button class="btn-cancel" onclick="cancelSession('${s.id}')">Cancel</button>` : ""}
          ${!IS_MENTOR && s.status === "completed" ? `<a class="btn-review" href="reviews.html">⭐ Leave a review</a>` : ""}
        </div>

        ${IS_MENTOR && s.status === "completed" ? `
          <div class="progress-section">
            <label>Session notes</label>
            <textarea id="notes-${s.id}" placeholder="What was covered in this session?">${s.notes || ""}</textarea>
            <button class="mh-btn mh-btn-sm" style="margin-top:8px" onclick="saveNotes('${s.id}')">Save notes</button>
          </div>` : ""}
      `;

      list.appendChild(card);
    });

    el.appendChild(list);
  }

  // ── Actions ───────────────────────────────────────────────────
  async function saveMeetingLink(sessionId){
    const val = $("link-" + sessionId)?.value?.trim();
    if(!val){ alert("Please enter a meeting link."); return; }
    const {error} = await sb.from("sessions").update({meeting_link: val}).eq("id", sessionId);
    if(error){ console.error(error); alert("Could not save link."); return; }
    showToast("Meeting link saved!");
    await loadSessions();
  }

  async function markCompleted(sessionId){
    if(!confirm("Mark this session as completed?")) return;
    const {error} = await sb.from("sessions").update({status:"completed"}).eq("id", sessionId);
    if(error){ console.error(error); alert("Could not update session."); return; }
    showToast("Session marked as completed!");
    await loadSessions();
  }

  async function cancelSession(sessionId){
    if(!confirm("Cancel this session?")) return;
    const {error} = await sb.from("sessions").update({status:"cancelled"}).eq("id", sessionId);
    if(error){ console.error(error); alert("Could not cancel."); return; }
    showToast("Session cancelled.");
    await loadSessions();
  }

  async function saveNotes(sessionId){
    const notes = $("notes-" + sessionId)?.value?.trim();
    const {error} = await sb.from("sessions").update({notes}).eq("id", sessionId);
    if(error){ console.error(error); return; }
    showToast("Notes saved!");
  }

  // ── Toast ─────────────────────────────────────────────────────
  function showToast(msg){
    let t = document.getElementById("toast");
    if(!t){ t = document.createElement("div"); t.id = "toast"; t.className = "mh-toast"; document.body.appendChild(t); }
    t.textContent = msg; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2600);
  }

  $("signOutBtn").onclick = async () => { await sb.auth.signOut(); window.location.href = "auth.html?mode=signin"; };

  init();
</script>

<!-- Mobile drawer -->
<div id="navOverlay" onclick="closeDrawer()" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);z-index:90;"></div>
<div class="mh-mobile-drawer" id="mobileDrawer">
  <div class="drawer-head">
    <div class="drawer-head-brand"><img src="logo.png" alt="MentifyHub"/><strong>MentifyHub</strong></div>
    <button class="mh-drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="mh-drawer-links">
    <a href="#" id="drawerDashLink" class="mh-drawer-link"><span class="icon">🏠</span> Dashboard</a>
    <a href="mentor-directory.html" class="mh-drawer-link"><span class="icon">🔍</span> Directory</a>
    <a href="messages.html" class="mh-drawer-link"><span class="icon">💬</span> Messages</a>
    <a href="sessions.html" class="mh-drawer-link active"><span class="icon">📅</span> Sessions</a>
    <a href="reviews.html" class="mh-drawer-link"><span class="icon">⭐</span> Reviews</a>
  </div>
  <div class="mh-drawer-footer">
    <button class="mh-drawer-signout" onclick="drawerSignOut()">🚪 Sign out</button>
  </div>
</div>
<script>
  function openDrawer(){ const d=$("mobileDrawer"),o=$("navOverlay"); if(d&&o){d.classList.add("open");o.style.display="block";document.body.style.overflow="hidden";} }
  function closeDrawer(){ const d=$("mobileDrawer"),o=$("navOverlay"); if(d&&o){d.classList.remove("open");o.style.display="none";document.body.style.overflow="";} }
  async function drawerSignOut(){ try{ await sb.auth.signOut(); }catch(e){} window.location.href="auth.html?mode=signin"; }
</script>
</body>
</html>
